<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QuillBot AI Detector</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo">AI</div>
    <div>
      <h1>AI Detector</h1>
      <p class="subtitle">QuillBot prototype</p>
    </div>
  </header>

  <div class="glass-card panel">
    <textarea id="inputText" placeholder="Paste text to analyze..."></textarea>
    <div class="controls">
      <button id="detectBtn" class="btn-primary">Detect</button>
    </div>
  </div>

  <div class="glass-card result-card">
    <div class="score-row">
      <span id="score" aria-live="polite"></span>
    </div>
    <div id="explain"></div>
  </div>

  <p class="disclaimer">Heuristic estimate, computed locally — not a state-of-the-art classifier.</p>

  <script src="detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
